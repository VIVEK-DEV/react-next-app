name: Deploy to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          
      - name: Prepare ZIP
        run: zip -r nextjs-app.zip .next package.json node_modules public

      - name: Deploy Next.js via Azure CLI
        run: |
          az webapp deploy \
            --resource-group rg-nextjs-nonprod \
            --name react-next-app \
            --src-path nextjs-app.zip \
            --type zip
