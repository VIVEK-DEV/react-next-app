name: Deploy Next.js to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js 20 for build
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Build Next.js app
      - name: Build Next.js app
        run: npm run build

      # 5️⃣ Azure login
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 6️⃣ Prepare ZIP for deployment (skip node_modules for faster deploy)
      - name: Prepare deployment ZIP
        run: |
          zip -r nextjs-app.zip . -x '*.git*' -x 'node_modules/*'

      # 7️⃣ Deploy ZIP to Azure Web App
      - name: Deploy Next.js via Azure CLI
        run: |
          az webapp deploy \
            --resource-group rg-nextjs-nonprod \
            --name react-next-second \
            --src-path nextjs-app.zip \
            --type zip
