name: Deploy Next.js Standalone to Azure Web App (Non-Prod)

on:
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  NODE_VERSION: "24.x"          # NOTE: Node 24 is not safe for Azure WebApp yet
  ARTIFACT_NAME: nextjs-standalone
  ZIP_NAME: nextjs-app.zip

jobs:
  build:
    name: Build and Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Prepare deployment folder
        run: |
          ARTIFACT="${{ env.ARTIFACT_NAME }}"

          rm -rf "$ARTIFACT"
          mkdir -p "$ARTIFACT"

          # Copy minimal standalone server from Next.js build
          rsync -a .next/standalone/ "$ARTIFACT/"

          # Copy .next/static (Next.js does not copy automatically)
          mkdir -p "$ARTIFACT/.next"
          cp -r .next/static "$ARTIFACT/.next/static"

          # Copy public folder if present
          if [ -d "public" ]; then
            cp -r public "$ARTIFACT/public"
          fi

          # Include package.json
          cp package.json "$ARTIFACT/package.json"

          # If you use next.config.js and it is required at runtime (rare), include it:
          if [ -f "next.config.js" ]; then
            cp next.config.js "$ARTIFACT/next.config.js"
          fi

          # Zip the artifact
          cd "$ARTIFACT"
          zip -r "../${{ env.ZIP_NAME }}" .
          cd ..

      - name: Upload zipped artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-zip
          path: ${{ env.ZIP_NAME }}
          compression-level: 0


  deploy:
    name: Deploy to Azure Web App
    runs-on: ubuntu-latest
    needs: build

    # IMPORTANT: This links the job to GitHub Environment "Non-Prod"
    # so it can access Environment Secrets
    environment: Non-Prod

    steps:
      - name: Download zipped artifact
        uses: actions/download-artifact@v4
        with:
          name: nextjs-zip
          path: .

      - name: Deploy to Azure WebApp (Publish Profile)
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.Azure_WEBAPP_NAME }}
          publish-profile: ${{ secrets.Azure_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.ZIP_NAME }}